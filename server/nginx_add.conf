# 把这两个 location 块加到 seed_server.conf 的 server{} 里
# （和已有的 /upload_weight、/latest_weight 并列）

location /ai_chat {
    proxy_pass http://127.0.0.1:8002;
    proxy_set_header Host $host;
    proxy_read_timeout 60s;
}

location /generate_report {
    proxy_pass http://127.0.0.1:8002;
    proxy_set_header Host $host;
    proxy_read_timeout 60s;
}

location /health {
    proxy_pass http://127.0.0.1:8002;
    proxy_set_header Host $host;
}
